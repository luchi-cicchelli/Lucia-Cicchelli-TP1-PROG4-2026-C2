<section class="admin">
  <header class="admin__encabezado">
    <h1 class="titulo">Panel de administración</h1>
    <p>Todo lo del cine, en un solo lugar.</p>
  </header>

  @for (g of grupos; track g.titulo) {
    <div class="panel__grupo">
      <h2 class="panel__titulo">{{ g.titulo }}</h2>
      <div class="panel__grilla">
        @for (a of g.accesos; track a.ruta) {
          <a class="tarjeta panel__acceso" [routerLink]="a.ruta">
            <strong>{{ a.titulo }}</strong>
            <span>{{ a.descripcion }}</span>
          </a>
        }
      </div>
    </div>
  }
</section>
